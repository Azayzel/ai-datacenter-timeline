Turing's imitation game","theory",3,'"Computing Machinery and Intelligence" asks whether machines can think and proposes a test that still frames the argument 75 years later.'],[1956.5,"Dartmouth workshop","theory",3,'John McCarthy coins "artificial intelligence" at a summer workshop that predicts major progress in one summer. The field gets its name and its habit of optimistic scheduling.'],[1957.5,"Rosenblatt's Perceptron","models",2,"A trainable classifier, backed by the US Navy, promised to the press as the embryo of a machine that will walk, talk, and see. It can sort some shapes."],[1959.5,'"Machine learning" coined',"theory",1,"Arthur Samuel's checkers program improves through self-play at IBM and gives the discipline its most durable term."],[1966.2,"ELIZA","models",2,"Weizenbaum's pattern-matching therapist runs on about 200 lines of logic. Users confide in it anyway, which alarms him more than the program does."],[1969.5,'"Perceptrons" published',"theory",2,"Minsky and Papert prove what single-layer networks cannot learn. Funding agencies read the pessimism, and neural nets enter a long exile."],[1973.5,"Lighthill report","industry",2,"A UK government audit calls AI's promises unmet. Grants collapse on both sides of the Atlantic and the first winter sets in."],[1980.5,"XCON ships at DEC","industry",2,"An expert system configures VAX orders and saves DEC an estimated $40M a year. Corporate money returns, chasing rule-based systems."],[1982.5,"Hopfield nets, Fifth Gen","theory",1,"Physics lends AI a memory model while Japan commits $850M to its Fifth Generation project, prodding US agencies to respond in kind."],[1986.7,"Backpropagation goes mainstream","theory",3,"Rumelhart, Hinton, and Williams show multilayer networks learning internal representations. The exiled idea gets its training algorithm."],[1987.5,"Lisp machine collapse","industry",2,"The market for specialized AI hardware dies as commodity workstations catch up. Expert systems stall, and the second winter begins."],[1989.5,"CNNs read ZIP codes","models",2,"LeCun's convolutional networks sort real mail at Bell Labs, a working preview of deep learning two decades before the hardware could scale it."],[1997.4,"Deep Blue beats Kasparov","models",3,"Custom IBM silicon and brute-force search take the chess crown. A machine outplays the best human at the game long used to define intellect."],[1997.8,"LSTM","theory",2,"Hochreiter and Schmidhuber solve the vanishing gradient for recurrent nets. Their architecture carries sequence modeling for the next twenty years."],[2006.2,"AWS opens the meter","hardware",3,"S3 and EC2 make compute rentable by the hour. The modern data center stops being a cost center and becomes a product."],[2006.6,'"Deep learning" returns',"theory",2,"Hinton's deep belief nets make deep stacks trainable again, and the rebrand sticks. GPUs are about to make it practical."],[2007.2,"NVIDIA ships CUDA","hardware",3,"Gaming silicon opens to general-purpose compute. Nobody at the launch calls it the substrate of a trillion-dollar industry."],[2009.5,"ImageNet","theory",2,"Fei-Fei Li bets that data scale matters as much as algorithms: 14M labeled images and an annual contest that becomes the field's proving ground."],[2011.1,"Watson wins Jeopardy!","models",2,"IBM's question-answering system beats two champions on live TV. Months later, Siri puts a conversational interface in millions of pockets."],[2012.75,"AlexNet","models",3,"Two consumer GPUs, 60M parameters, and an ImageNet error rate cut by roughly 40%. Deep learning's big bang, and the moment compute demand changes character."],[2014,"Google acquires DeepMind","industry",1,"A ~$500M purchase of a lab with no product signals that frontier research is now a strategic asset."],[2014.5,"GANs","theory",2,"Goodfellow frames generation as an adversarial game. Networks stop only classifying the world and start producing it."],[2015.8,"OpenAI founded, TensorFlow open-sourced","industry",2,"A billion-dollar research lab and free industrial tooling reset the field's center of gravity toward scale."],[2016.2,"AlphaGo defeats Lee Sedol","models",3,"Move 37. Reinforcement learning plus deep nets crack a game with more positions than atoms in the universe."],[2016.4,"Google reveals the TPU","hardware",2,"The first custom AI silicon deployed at fleet scale. Hyperscalers begin designing chips around neural workloads, not the reverse."],[2017.5,'"Attention Is All You Need"',"theory",3,"Eight authors at Google publish the Transformer: parallelizable, scalable, and hungry. Everything after this runs on it."],[2018.5,"GPT-1 and BERT","models",2,"Pretrain on the internet, fine-tune for the task. The recipe that turns language modeling into infrastructure."],[2019.2,"GPT-2 staged release","models",1,`The "too dangerous to release" framing puts scaling on front pages. Microsoft's $1B into OpenAI follows within months.`],[2020.4,"GPT-3 and the scaling laws","models",3,"175B parameters, and Kaplan's curves arguing that more compute keeps paying. The buildout now has a business case in log-log."],[2021.5,"Copilot preview","industry",2,"AI writes production code inside the editor. Developers become the first profession to feel the ground move daily."],[2022.6,"Stable Diffusion, DALL\xB7E 2","models",2,"Image generation goes open-weight and viral in the same summer. Consumer GPUs strain; cloud GPUs vanish from stock."],[2022.92,"ChatGPT","industry",3,"100M users in two months, the fastest consumer adoption ever recorded. The demand shock that reprices compute and reroutes the US construction industry."],[2023.2,"GPT-4, Claude, LLaMA","models",3,"The frontier closes ranks behind APIs while leaked-then-licensed open weights fork the ecosystem in the other direction."],[2023.4,"NVIDIA joins the trillion-dollar club","hardware",2,"H100 demand outruns supply for years of backlog. Chip allocation becomes corporate strategy."],[2024.7,"Reasoning models","models",2,"o1-class systems spend compute at inference time to think longer. A second scaling axis opens, and it bills by the token."],[2024.45,"NVIDIA, most valuable company on Earth","hardware",3,"The picks-and-shovels vendor of the gold rush briefly tops every oil major, bank, and phone maker combined."],[2025.05,"DeepSeek R1","models",3,"Near-frontier reasoning at a fraction of the reported training bill. NVIDIA sheds ~$600B in a day. The buildout pauses for breath, then accelerates anyway."],[2025.05,"Stargate announced","hardware",3,"OpenAI, Oracle, and SoftBank pitch ~$500B of US AI data centers. Infrastructure becomes a headline act of national industrial policy."],[2025.6,"Agents go to work","industry",2,"Coding agents and computer-use systems move from demo to daily tooling. Inference demand starts compounding independent of chat."],[2026.3,"The gigawatt era","hardware",2,"US data center construction runs near $50B a year. New campuses are sized in gigawatts and sited wherever the grid can feed them."],[2014.2,"Bluffdale vs. the NSA","water",1,"Utah's first data-center water fight goes public when a state bill proposes cutting the taps to the NSA's new facility. The bill dies; the playbook survives."],[2020.7,"Water-positive pledges","water",1,"Microsoft, then Google, promise to replenish more water than they consume by 2030. The pledges land right before consumption starts to climb."],[2022.55,"West Des Moines counts","water",2,"Iowa's utility reports that the data-center cluster where GPT-4 trained drew about 6% of district water in July 2022. Future projects must bring non-potable cooling."],[2022.95,"The Dalles opens the books","water",2,"After a year in court trying to keep the number secret, the Oregon city discloses that Google's campus drew 355 million gallons in 2021, about a quarter of its water."],[2023.3,"'Making AI Less Thirsty'","water",2,"UC Riverside researchers put inference on a water bill: a short chatbot session costs about a bottle of water once cooling and generation
